name: Build Windows EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt60PyQt6-WebEngine pyinstaller
          pip install -r requirements.txt --ignore-installed PyQt6 PyQt6-WebEngine
          
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "PvZ-Desktop" --clean --add-data "static;static" --add-data "custom_waves;custom_waves" main.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZ-Desktop-Windows
          path: dist/*.exe
